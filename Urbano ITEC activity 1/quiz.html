        <style>
            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                text-decoration: none;
                scroll-behavior: smooth;
                font-family: "Poppins";  
            }
            header{ background-color: rgb(118, 94, 255);

            }
            nav button{ background-color: rgb(81, 50, 235);

            }
            body{ 
                padding: 250px;

                background-repeat: no-repeat;
                background-size: cover;
                background-attachment: fixed;
                background-color: rgb(65, 11, 214); 
                
            }
            main{ background-color: rgba(16, 2, 97, 0.5);
                  padding: 15px 30px 15px 30px;
                  box-shadow: 40px 40px 35px 5px rgba(0,0,0,0.75);
                  text-align: justify;

            h1{  text-align: center; color: rgb(237, 253, 4); font-family: "Times New Roman";}

            }
            
            #info2{

            }

            footer{ background-color: rgb(118, 94, 255);

                border-radius: 0px 0px 30px 30px;
                text-align: center;
                font-family: "Times New Roman";
                color: whitesmoke;
                h3{ color: rgb(237, 253, 4);}
            
            }
            .gallery{
                display: grid;
                grid-template-columns: repeat(3, 1fr); /* 3 images per row */
                gap: 20px;
                margin-top: 20px;
            }

               .gallery-item{
                text-align: center;
            }

            .gallery-item img{
                width: 100%;
                height: 200px;
                object-fit: cover;
                border-radius: 15px;
                box-shadow: 5px 5px 10px rgba(0,0,0,0.5);

            .gallery-item h3{
                color: rgb(237, 253, 4);
                margin-top: 10px;
                font-family: "Times New Roman";
